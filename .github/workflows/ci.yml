name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Finish every combination, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22.12.0 is the minimum in package.json "engines". 26.x is the newest
        # release: setup-node's "current" alias would pick the Node 27 alpha,
        # so add "27.x" here once Node 27.0.0 is out (April 2027).
        node: ["22.12.0", "22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
